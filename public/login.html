<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login — ChallanPro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:14px;padding:32px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.logo{text-align:center;margin-bottom:24px}
.logo h1{font-size:22px;color:#0f172a;font-weight:800}
.logo p{color:#64748b;font-size:13px;margin-top:4px}
label{font-size:12px;color:#64748b;font-weight:600;display:block;margin-bottom:5px}
.inp{width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;font-size:14px;outline:none;margin-bottom:14px}
.inp:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.btn{width:100%;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;background:#1d4ed8;color:#fff}
.btn:hover{background:#1e40af}
.btn:disabled{opacity:.6;cursor:not-allowed}
.err{background:#fee2e2;color:#b91c1c;padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none}
.step2{display:none}
.otp-inp{font-size:24px;letter-spacing:12px;text-align:center;font-weight:800}
.hint{color:#94a3b8;font-size:12px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>ChallanPro</h1>
    <p>Billing &amp; Credit Manager</p>
  </div>
  <div id="err" class="err"></div>
  <div id="step1">
    <label>Email address</label>
    <input class="inp" id="email" type="email" placeholder="you@company.com" autocomplete="email">
    <button class="btn" id="send-btn" onclick="sendOtp()">Send OTP</button>
  </div>
  <div id="step2" class="step2">
    <label>Enter 6-digit OTP</label>
    <input class="inp otp-inp" id="otp" maxlength="6" placeholder="000000" inputmode="numeric">
    <button class="btn" id="verify-btn" onclick="verifyOtp()">Verify &amp; Login</button>
    <p class="hint"><a href="#" onclick="showStep1();return false" style="color:#3b82f6">← Use different email</a></p>
  </div>
</div>
<script>
let userEmail = '';
function showErr(msg){const e=document.getElementById('err');e.textContent=msg;e.style.display='block';}
function hideErr(){document.getElementById('err').style.display='none';}
function showStep1(){document.getElementById('step1').style.display='block';document.getElementById('step2').style.display='none';hideErr();}
async function sendOtp(){
  hideErr();
  userEmail=document.getElementById('email').value.trim().toLowerCase();
  if(!userEmail){showErr('Enter your email');return;}
  const btn=document.getElementById('send-btn');btn.disabled=true;btn.textContent='Sending…';
  try{
    const r=await fetch('/api/auth/request-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:userEmail})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Failed');
    document.getElementById('step1').style.display='none';
    document.getElementById('step2').style.display='block';
    document.getElementById('otp').focus();
  }catch(e){showErr(e.message);}
  btn.disabled=false;btn.textContent='Send OTP';
}
async function verifyOtp(){
  hideErr();
  const otp=document.getElementById('otp').value.trim();
  if(otp.length!==6){showErr('Enter 6-digit OTP');return;}
  const btn=document.getElementById('verify-btn');btn.disabled=true;btn.textContent='Verifying…';
  try{
    const r=await fetch('/api/auth/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email:userEmail,otp})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Failed');
    window.location.href='/';
  }catch(e){showErr(e.message);}
  btn.disabled=false;btn.textContent='Verify & Login';
}
fetch('/api/auth/me',{credentials:'include'}).then(r=>r.json()).then(d=>{if(d.user)window.location.href='/';});
</script>
</body>
</html>
