# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: challan-pro
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /login.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: UPLOADS_DIR
        value: uploads
    # Persistent disk for logo uploads — add manually in Render dashboard:
    # Disks → Add Disk → mount path: uploads (or match UPLOADS_DIR)
